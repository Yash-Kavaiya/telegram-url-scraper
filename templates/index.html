<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telegram URL Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
    <div class="max-w-xl mx-auto mt-10 bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-2">Telegram URL Scraper</h1>
        <p class="text-gray-600 mb-4">
            Upload a Telegram Desktop chat export (<span class="font-medium">JSON</span>).
            The app lists the URLs it finds and lets you download a messages CSV and a URLs CSV.
        </p>
        {% if error %}
        <div class="bg-red-50 border border-red-300 text-red-800 px-4 py-3 rounded mb-4" role="alert">
            {{ error }}
        </div>
        {% endif %}
        <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
            <label class="block font-medium mb-2" for="jsonFile">JSON file</label>
            <input id="jsonFile" class="block w-full mb-4" type="file" name="file" accept=".json,application/json" required>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded" type="submit">
                Extract URLs
            </button>
        </form>
        <p class="text-sm text-gray-500 mt-6">
            <a class="text-blue-700 underline" href="https://github.com/Yash-Kavaiya/telegram-url-scraper">Source on GitHub</a>
        </p>
    </div>
</body>
</html>
